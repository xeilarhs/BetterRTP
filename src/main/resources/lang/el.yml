    Error: '&cΣφάλμα! &7Μη έγκυρη εισαγωγή δεδομένων!'
    Set: '&bΕπιτυχία! &7%type% ορισμένος σε %value%'
    Remove: '&cΔιαγραμένο! &7Διάγραψες custom κόσμο %world%'

Help:
  Prefix: '&e&m-----&6&l BetterRTP &8| Βοήθεια &e&m-----'
  Main: ' &7- &e/%command% &7- Σε κάνει τηλεμεταφορά σε τυχαίο μέρος!'
  Biome: ' &7- &e/%command% biome <τοπίο1, τοπίο2...> &7- Σε κάνει τυχαία τηλεμεταφόρα
    σε αυτά τα τοπία'
  Edit: ' &7- &e/%command% edit <default/κόσμος> [args...] &7- Άλλαξε κάποιες ρυθμίσεις
    plugin'
  Help: ' &7- &e/%command% help &7- Δείχνη λίστα βοήθειας'
  Info: ' &7- &e/%command% info [world/particles/shapes/potion_effects] &7- Δες συγκεκριμένες
    πληροφορίς για τα παράμετρα του plugin'
  Player: ' &7- &e/%command% player <player> [κόσμος] [τοπίο1, τοπίο2...] &7- Κάνει
    τηλεμεταφορά σε τυχαίο μέρος αλλόν/η παίκτη'
  Reload: ' &7- &e/%command% reload &7- Ξανά φορτώνει το plugin'
  Settings: ' &7- &e/%command% settings &7- Εμφανίζει ένα gui και άλλαξε κάποιες ρυθμίσεις'
  Test: ' &7- &e/%command% test &7- Δοκίμασε κάποια plugin έφε μετά απο τηλεμεταφόρα
    χώρις να κουνηθείς'
  Version: ' &7- &e/%command% version &7- Δες την έκδοση που εκτελείται αυτήν την
    στιγμή'
  World: ' &7- &e/%command% world <κόσμος> [τοπίο1, τοπίο2...] &7- Σε κάνει τυχαία
    τηλεμεταφορά σε άλλον κόσμο'
  Location: ' &7- &e/%command% location <μέρος_όνομα> &7- Rtp χρησιμοποιώντας ένα
    συγκεκριμένο μέρος'

Usage:
  Player: '&cΧρήση&7: /%command% player <παίκτης> [κόσμος] [τοπίο1, τοπίο2]'
  World: '&cΧρήση&7: /%command% world <κόσμος> [τοπίο1, τοπίο2...]'
  Biome: '&cΧρήση&7: /%command% biome <τοπίο1, τοπίο2...>'
  Location: '&cΧρήση&7: /%command% location <location_name>'
  Edit:
    Base: '&cΧρήση&7: /%command% edit <default/κόσμος> [args...]'
    Default: '&cΧρήση&7: /%command% edit default <μέγιστο/ελάχιστο/χρήσηόριακόσμου/κέντρο>
      <αξία>'
    World: '&cΧρήση&7: /%command% edit customworld <κόσμος> <μέγιστο/ελάχιστο/χρήσηόριακόσμου/κέντρο>
      <αξία>'
    PermissionGroup: '&Χρήση&7: /%command% edit permission_group <γκρουπ> <κόσμος>
      <μέγιστο/ελάχιστο/χρήσηόριακόσμου/κέντρο> <αξία>'
    Location: '&cΧρήση&7: /%command% edit location <τοπίο_όνομα> <μέγιστο/ελάχιστο/χρήσηόριακόσμου/κέντρο>
      <αξία>'
    Worldtype: '&cΧρήση&7: /%command% edit world_type <κόσμος> <NETHER/ΚΑΝΟΝΙΚΟ>'
    Override: '&cΧρήση&7: /%command% edit override <κόσμος> <κόσμος_προς>'
    BlacklistedBlocks: '&cUsage&7: /%command% edit blacklistedblocks <πρόσθεσαι/αφέρεσαι>
      <id_κύβου>'
